name: build-and-test
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'Financial.slnx'
      - 'Directory.Build.props'
      - 'global.json' 
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: financial_test
          POSTGRES_USER: financial_test
          POSTGRES_PASSWORD: ci-only-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U financial_test -d financial_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FINANCIAL_TEST_CONNECTION: Host=localhost;Port=5432;Database=financial_test;Username=financial_test;Password=ci-only-local-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - run: dotnet restore Financial.slnx
      - run: dotnet build Financial.slnx --no-restore -c Release
      - run: dotnet test Financial.slnx --no-build -c Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - name: Bounded API exercise with PostgreSQL
        run: bash scripts/benchmark-ci.sh
      - name: Complete test suite inside Docker
        run: |
          trap 'docker compose -p carrefour-suite-ci --profile tests down -v' EXIT
          docker compose -p carrefour-suite-ci --profile tests run --build --rm tests
      - name: Full Docker Compose evaluation smoke test
        run: bash scripts/test-docker.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 14
